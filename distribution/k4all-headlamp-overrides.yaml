# Cairn on a k4all cluster: ClusterConfig componentOverrides for the
# headlamp component. Helm lists replace, they do not merge, so the k4all
# plugin's initContainer, volume and mount are repeated here (and Hangar's,
# when you run it too): keep them in step with the k4all release
# (ghcr.io/gpillon/k4all-headlamp-plugin tag).
#
# This is the k4all integration (https://github.com/gpillon/k4all), for
# k4all releases that do not install Cairn themselves: before v2.7.0, or
# with Rook installed by hand. From v2.7.0 k4all merges these lists with
# its own by name and keeps its tag of the plugins it ships. On any other
# cluster use headlamp-values.yaml.
#
#   kubectl patch clusterconfig k4all-cluster-config --type merge \
#     --patch-file k4all-headlamp-overrides.yaml
spec:
  componentOverrides:
    headlamp:
      values:
        initContainers:
          - name: k4all-plugin
            image: ghcr.io/gpillon/k4all-headlamp-plugin:0.1.2
            imagePullPolicy: IfNotPresent
            command: [sh, -c, "cp -R /plugins/k4all-headlamp-plugin/. /k4all-plugin/"]
            resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 32Mi}}
            securityContext: &sc
              runAsNonRoot: true
              runAsUser: 100
              runAsGroup: 101
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
              seccompProfile: {type: RuntimeDefault}
            volumeMounts: [{name: k4all-plugin, mountPath: /k4all-plugin}]
          - name: cairn-plugin
            image: ghcr.io/kalik1/cairn-headlamp-plugin:0.1.1
            imagePullPolicy: IfNotPresent
            command: [sh, -c, "cp -R /plugins/cairn-headlamp-plugin/. /cairn-plugin/"]
            resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 32Mi}}
            securityContext: *sc
            volumeMounts: [{name: cairn-plugin, mountPath: /cairn-plugin}]
        volumes:
          - {name: k4all-plugin, emptyDir: {sizeLimit: 16Mi}}
          - {name: cairn-plugin, emptyDir: {sizeLimit: 16Mi}}
        volumeMounts:
          - {name: k4all-plugin, mountPath: /headlamp/plugins/k4all-headlamp-plugin, readOnly: true}
          - {name: cairn-plugin, mountPath: /headlamp/plugins/cairn-headlamp-plugin, readOnly: true}
